<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
/* Plan : bleu électrique sur gris froid, titres condensés façon affichage de salle, listes denses et lisibles sur téléphone. */
:root {
  --bg: #f1f3f7;
  --surface: #ffffff;
  --ink: #141a26;
  --muted: #5b6577;
  --line: #dde2ea;
  --accent: #1d4ed8;
  --accent-ink: #ffffff;
  --accent-soft: #e3ebff;
  --ok: #0f7a4a;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1420;
    --surface: #182030;
    --ink: #eef1f7;
    --muted: #97a2b8;
    --line: #2a3447;
    --accent: #7aa2ff;
    --accent-ink: #0b1226;
    --accent-soft: #1f2d52;
    --ok: #4cc38a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1420;
  --surface: #182030;
  --ink: #eef1f7;
  --muted: #97a2b8;
  --line: #2a3447;
  --accent: #7aa2ff;
  --accent-ink: #0b1226;
  --accent-soft: #1f2d52;
  --ok: #4cc38a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 64px; }
header { display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px; }
h1 {
  font-family: var(--font-display);
  font-size: 40px;
  line-height: 1;
  letter-spacing: 0.01em;
  text-transform: uppercase;
  margin: 0;
  text-wrap: balance;
}
.sub { color: var(--muted); margin: 0; }
h2 {
  font-family: var(--font-display);
  font-size: 26px;
  text-transform: uppercase;
  margin: 0;
  letter-spacing: 0.01em;
  text-wrap: balance;
}
h3 {
  font-family: var(--font-display);
  font-size: 20px;
  text-transform: uppercase;
  margin: 20px 0 10px;
  letter-spacing: 0.01em;
}

.tabs { display: flex; gap: 6px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 16px; }
.tab {
  flex: 1; min-height: 44px; border: 0; border-radius: 9px; background: transparent;
  color: var(--muted); font: 600 15px var(--font-body); cursor: pointer; padding: 0 4px;
}
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.chip {
  min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font: 500 15px var(--font-body); cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }

.search {
  width: 100%; min-height: 46px; padding: 0 14px; margin-bottom: 12px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); font: 400 16px var(--font-body);
}

.prog-head { display: flex; flex-direction: column; gap: 4px; margin: 4px 0 12px; }
.meta { color: var(--muted); font-size: 14px; }
.progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 8px 0 14px; }
.progress > i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .2s; }
@media (prefers-reduced-motion: reduce) { .progress > i { transition: none; } }

.list { display: flex; flex-direction: column; gap: 10px; padding: 0; margin: 0; list-style: none; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px;
  display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: start;
}
.card.plain { grid-template-columns: 1fr; }
.card.done { border-color: var(--ok); }
.card.done .name { text-decoration: line-through; text-decoration-thickness: 1px; color: var(--muted); }
.check { width: 26px; height: 26px; margin: 2px 0 0; accent-color: var(--ok); cursor: pointer; }
.name { font-family: var(--font-display); font-size: 22px; font-weight: 700; text-transform: uppercase; line-height: 1.1; }
.dose { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--accent); white-space: nowrap; }
.body { grid-column: 2; display: flex; flex-direction: column; gap: 6px; }
.card.plain .body { grid-column: 1; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; font-weight: 600; letter-spacing: .02em; padding: 3px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
.tag.eq { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.tip { margin: 0; color: var(--ink); }
.count { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.reset { margin-top: 14px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 15px var(--font-body); cursor: pointer; }
.note { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; margin: 0 0 12px; }
.mini { margin: 0; padding-left: 18px; }
.mini li { margin: 2px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Catalogue Full Body</h1>
    <p class="sub" id="sub"></p>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-prog" aria-selected="true" data-view="prog">Programme</button>
    <button class="tab" role="tab" id="tab-cat" aria-selected="false" data-view="cat">Catalogue</button>
    <button class="tab" role="tab" id="tab-nut" aria-selected="false" data-view="nut">Alimentation</button>
  </div>

  <section id="view-prog">
    <div class="chips" id="sessChips" role="group" aria-label="Séance"></div>
    <div class="prog-head">
      <h2 id="sessTitle"></h2>
      <span class="meta" id="sessMeta"></span>
    </div>
    <div class="progress" aria-hidden="true"><i id="bar"></i></div>
    <ul class="list" id="sessList"></ul>
    <button class="reset" id="resetBtn" type="button">Remettre la séance à zéro</button>
    <h3>Semaine type</h3>
    <ul class="mini" id="week"></ul>
  </section>

  <section id="view-cat" hidden>
    <label for="q" class="meta">Rechercher un exercice ou un muscle</label>
    <input id="q" class="search" type="search" placeholder="ex. hip thrust, fessiers, machine" autocomplete="off">
    <div class="chips" id="groupChips" role="group" aria-label="Groupe"></div>
    <p class="count" id="catCount"></p>
    <ul class="list" id="catList"></ul>
  </section>

  <section id="view-nut" hidden>
    <p class="note">Repères généraux, pas un suivi de diététicien. Donne-moi ton poids et ta taille et je calcule tes quantités.</p>
    <h3>Les repères</h3>
    <ul class="list" id="rules"></ul>
    <h3>Les repas</h3>
    <div class="chips" id="mealChips" role="group" aria-label="Moment"></div>
    <p class="count" id="mealCount"></p>
    <ul class="list" id="mealList"></ul>
    <h3>Légumes et fibres sans légumes verts</h3>
    <ul class="mini" id="veg"></ul>
    <h3>Courses de base</h3>
    <ul class="mini" id="shop"></ul>
  </section>
</div>

function el(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
function today(){ var d = new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function key(){ return "fb2-"+today()+"-"+state.sess; }
function loadDone(){ try { return JSON.parse(localStorage.getItem(key())) || {}; } catch(e){ return {}; } }

function plural(n, w){ return n+" "+w+(n>1?"s":""); }

}

    var b = el("button","chip",it); b.type = "button";
    b.setAttribute("aria-pressed", isOn(i) ? "true" : "false");
    b.addEventListener("click", function(){ onPick(i); });
    box.appendChild(b);
  });
}

function renderProg(){
  renderChips(document.getElementById("sessChips"), SESS.map(function(s){return s.n;}),
    function(i){return i===state.sess;}, function(i){ state.sess=i; renderProg(); });
  var S = SESS[state.sess];
  document.getElementById("sessTitle").textContent = S.n;
  document.getElementById("sessMeta").textContent = S.d+" "+plural(S.l.length,"bloc")+".";
  var done = loadDone();
  var list = document.getElementById("sessList"); list.textContent = "";
  S.l.forEach(function(row, idx){
    var x = byId[row[0]];
    var k = idx+"-"+x.id;
    var li = el("li","card"+(done[k]?" done":""));
    var cb = el("input","check"); cb.type="checkbox"; cb.id="c-"+k; cb.checked = !!done[k];
    cb.setAttribute("aria-label","Fait : "+x.n);
    cb.addEventListener("change", function(){ var d = loadDone(); if(cb.checked) d[k]=1; else delete d[k]; saveDone(d); renderProg(); });
    var head = el("div","row");
    head.appendChild(el("span","name",x.n));
    head.appendChild(el("span","dose", row[1]===1 ? row[2] : row[1]+" × "+row[2]));
    var body = el("div","body");
    if(row[3]) body.appendChild(el("span","meta","Repos "+row[3]));
    body.appendChild(tagsFor(x));
    body.appendChild(el("p","tip",x.t));
    li.appendChild(cb); li.appendChild(head); li.appendChild(body);
    list.appendChild(li);
  });
  var n = S.l.filter(function(r, idx){ return done[idx+"-"+r[0]]; }).length;
  document.getElementById("bar").style.width = Math.round(100*n/S.l.length)+"%";
}

function renderCat(){
  renderChips(document.getElementById("groupChips"), GROUPS,
    function(i){return GROUPS[i]===state.group;}, function(i){ state.group=GROUPS[i]; renderCat(); });
  var q = norm(state.q.trim());
  var res = EX.filter(function(x){
    if(state.group!=="Tous" && x.g!==state.group) return false;
    if(!q) return true;
    return norm([x.n,x.g,x.e].concat(x.m).join(" ")).indexOf(q) !== -1;
  });
  document.getElementById("catCount").textContent = plural(res.length,"exercice");
  var list = document.getElementById("catList"); list.textContent = "";
  if(!res.length){ list.appendChild(el("li","empty","Aucun exercice trouvé. Essaie un autre mot.")); return; }
  res.forEach(function(x){
    var li = el("li","card plain");
    var head = el("div","row");
    head.appendChild(el("span","name",x.n));
    head.appendChild(el("span","meta",x.g));
    var body = el("div","body");
    body.appendChild(tagsFor(x));
    body.appendChild(el("p","tip",x.t));
    li.appendChild(head); li.appendChild(body);
    list.appendChild(li);
  });
}

function renderNut(){
  var rules = document.getElementById("rules"); rules.textContent = "";
  RULES.forEach(function(r){
    var li = el("li","card plain");
    li.appendChild(el("span","name",r.t));
    var b = el("div","body"); b.appendChild(el("p","tip",r.d));
    li.appendChild(b); rules.appendChild(li);
  });
  renderChips(document.getElementById("mealChips"), MOMENTS,
    function(i){return MOMENTS[i]===state.moment;}, function(i){ state.moment=MOMENTS[i]; renderNut(); });
  var res = MEALS.filter(function(m){ return state.moment==="Tous" || m.w===state.moment; });
  document.getElementById("mealCount").textContent = plural(res.length,"idée")+" · protéines approximatives";
  var list = document.getElementById("mealList"); list.textContent = "";
  res.forEach(function(m){
    var li = el("li","card plain");
    var head = el("div","row");
    head.appendChild(el("span","name",m.n));
    head.appendChild(el("span","dose",m.p));
    var body = el("div","body");
    var tags = el("div","tags"); tags.appendChild(el("span","tag",m.w)); tags.appendChild(el("span","tag eq",m.tm));
    body.appendChild(tags);
    body.appendChild(el("p","tip",m.i));
    li.appendChild(head); li.appendChild(body); list.appendChild(li);
  });
  fill("veg", VEG); fill("shop", SHOP);
}
function fill(id, arr){ var u = document.getElementById(id); u.textContent = ""; arr.forEach(function(s){ u.appendChild(el("li",null,s)); }); }

function show(view){
  ["prog","cat","nut"].forEach(function(v){
    document.getElementById("view-"+v).hidden = v!==view;
    document.getElementById("tab-"+v).setAttribute("aria-selected", v===view ? "true" : "false");
  });
}
document.querySelectorAll(".tab").forEach(function(t){ t.addEventListener("click", function(){ show(t.dataset.view); }); });
document.getElementById("q").addEventListener("input", function(e){ state.q = e.target.value; renderCat(); });
document.getElementById("resetBtn").addEventListener("click", function(){ saveDone({}); renderProg(); });

document.getElementById("sub").textContent = "4 séances de musculation, 1 séance cardio et "+plural(EX.length,"exercice")+" de Fitness Park.";
fill("week", WEEK);
renderProg(); renderCat(); renderNut();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
